name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No setup-android step: the obsolete `tools` package it installs no
      # longer exists, so that action fails. The ubuntu runner already has
      # the Android SDK preinstalled (ANDROID_HOME is set by the runner).
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotiFilter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
